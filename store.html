<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate PC Simulator - Hardware Store</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #12121c);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navigational Header Bar */
        .game-navbar {
            background-color: #0f0f1a;
            border-bottom: 2px solid #2d2d44;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .nav-left-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: bold;
            color: #00c6ff;
        }

        /* The Custom Blue "Open Parts" Button */
        .parts-toggle-btn {
            background: #0072ff;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 114, 255, 0.3);
            transition: background 0.2s;
        }
        .parts-toggle-btn:hover {
            background: #0052d4;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 20px;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-links a.active {
            background-color: #0072ff;
            color: white;
        }

        /* Slide-Out Black Parts Drawer Menu Panel */
        .parts-sidebar-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: #000000; /* Solid pitch black background */
            border-right: 2px solid #222222;
            z-index: 99; /* Higher layer priority so it sits cleanly on top of store items */
            transition: left 0.3s ease-in-out;
            padding: 90px 20px 20px 20px;
            box-sizing: border-box;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
        }
        .parts-sidebar-drawer.open {
            left: 0;
        }

        .parts-sidebar-drawer h3 {
            margin: 0 0 15px 0;
            border-bottom: 2px solid #2d2d44;
            padding-bottom: 8px;
            color: #00c6ff;
            font-size: 18px;
        }

        .purchased-items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: calc(100vh - 140px);
        }

        /* Purchased item tiny display tags inside the drawer */
        .bought-item-tag {
            background: #14151f;
            border: 1px solid #2d2d44;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            border-left: 3px solid #00ff88;
        }

        /* Storefront Superstore Catalog Grid Structure Layout */
        .store-viewport {
            flex-grow: 1;
            padding: 40px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .store-header {
            border-bottom: 2px solid #00c6ff;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .catalog-matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .component-item-card {
            background-color: #0f0f1a;
            border: 1px solid #2d2d44;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: border-color 0.2s;
        }

        .component-item-card:hover {
            border-color: #00c6ff;
        }

        .component-item-card h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #ffffff;
        }

        .component-class {
            font-size: 12px;
            color: #8b8ba8;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .component-cost-value {
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 15px;
        }

        .purchase-action-btn {
            background-color: #0072ff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.15s;
        }

        .purchase-action-btn:hover {
            background-color: #0052d4;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar Layout -->
    <nav class="game-navbar">
        <div class="nav-left-group">
            <div class="nav-brand">🖥️ PC SIMULATOR</div>
            <!-- Open Parts Toggle Trigger Button -->
            <button class="parts-toggle-btn" onclick="togglePartsDrawer()">📦 Open Parts</button>
        </div>
        <div class="nav-links">
            <a href="index.html">Home Base</a>
            <a href="store.html" class="active">Hardware Shop</a>
        </div>
    </nav>

    <!-- Slide-Out Black Parts Drawer -->
    <div class="parts-sidebar-drawer" id="partsDrawer">
        <h3>📦 Collected Parts</h3>
        <div class="purchased-items-list" id="drawer-items-list">
            <p style="color: #555; font-size: 13px;">No items purchased yet.</p>
        </div>
    </div>

    <!-- Main Marketplace Display Content Canvas Area -->
    <div class="store-viewport">
        <div class="store-header">
            <h2>🛒 Global Parts Mega-Marketplace</h2>
            <p>Purchase custom computing assets here. They will automatically be transferred back onto your home rig base blueprint database profiles.</p>
        </div>

        <div class="catalog-matrix-grid" id="shop-catalog-display">
            <!-- Hardware component items get rendered here automatically -->
        </div>
    </div>

    <script>
        const storeRegistryData = [
            { title: "NVIDIA GeForce RTX 5090 GPU", price: "$1,999", spec: "Graphics Card" },
            { title: "Intel Core i9-16900K CPU", price: "$599", spec: "Processor" },
            { title: "AMD Ryzen 9 9950X CPU", price: "$649", spec: "Processor" },
            { title: "Corsair Vengeance 64GB DDR5", price: "$249", spec: "RAM Module" },
            { title: "Samsung 990 PRO 2TB NVMe SSD", price: "$189", spec: "Storage Drive" }
        ];

        const targetGrid = document.getElementById('shop-catalog-display');
        storeRegistryData.forEach(item => {
            const layoutCard = document.createElement('div');
            layoutCard.className = 'component-item-card';
            layoutCard.innerHTML = `
                <div>
                    <div class="component-class">${item.spec}</div>
                    <h3>${item.title}</h3>
                </div>
                <div>
                    <div class="component-cost-value">${item.price}</div>
                    <button class="purchase-action-btn" onclick="executeBuyOrder('${item.title}')">Acquire Part</button>
                </div>
            `;
            targetGrid.appendChild(layoutCard);
        });

        // Initialize and fill the slide drawer on page startup
        window.onload = function() {
            updateDrawerDisplay();
        };

        // Slide animation logic control utility
        function togglePartsDrawer() {
            document.getElementById('partsDrawer').classList.toggle('open');
        }

        function executeBuyOrder(name) {
            let currentInv = JSON.parse(localStorage.getItem('pc_simulator_inventory')) || [];
            
            if(!currentInv.includes(name)){
                currentInv.push(name);
            }
            
            localStorage.setItem('pc_simulator_inventory', JSON.stringify(currentInv));
            
            // Refresh the drawer items real-time upon clicking buy
            updateDrawerDisplay();
            
            alert(`📦 Part Purchased: [ ${name} ] has been shipped to Home Base! Open the 'Open Parts' tray to see it.`);
        }

        // Logic function to dynamically render storage items inside the slide box
        function updateDrawerDisplay() {
            const listContainer = document.getElementById('drawer-items-list');
            const savedItems = JSON.parse(localStorage.getItem('pc_simulator_inventory')) || [];

            if (savedItems.length === 0) {
                listContainer.innerHTML = `<p style="color: #555; font-size: 13px;">No items purchased yet.</p>`;
                return;
            }

            listContainer.innerHTML = ""; // Clear default placeholders
            savedItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bought-item-tag';
                itemDiv.innerHTML = `<strong>${item}</strong>`;
                listContainer.appendChild(itemDiv);
            });
        }
    </script>

</body>
</html>
