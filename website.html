<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWW.Bestbuy.com</title>
    <style>
        /* Base page layout reset */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Crisp white background */
            color: #202124;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Mock Web Browser Top Header Navigation Bar */
        .browser-navbar {
            background-color: #f1f3f4;
            border-bottom: 1px solid #dadce0;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            user-select: none;
        }

        /* Address input field displaying the custom domain */
        .address-input-bar {
            background-color: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            flex-grow: 1;
            color: #1a1b1c;
            letter-spacing: 0.5px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

        /* The Main Active Application Workspace Viewport */
        .main-window-viewport {
            flex-grow: 1;
            background-color: #ffffff; /* Solid white background canvas */
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }

        /* Best Buy Theme Elements */
        .store-brand-title {
            font-size: 42px;
            font-weight: 900;
            color: #040c13;
            margin-bottom: 5px;
            letter-spacing: -1px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .store-brand-subtitle {
            font-size: 16px;
            color: #5f6368;
            margin-bottom: 40px;
        }

        /* Catalog Layout Matrix Grid structure */
        .hardware-catalog-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }

        .hardware-item-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: box-shadow 0.2s ease-in-out, transform 0.2s ease-in-out;
        }

        .hardware-item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-color: #0046be; /* Best Buy Signature Blue Border Accent highlight */
        }

        .hardware-item-card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #040c13;
        }

        .hardware-tag {
            font-size: 12px;
            color: #70757a;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .hardware-price-tag {
            font-size: 24px;
            font-weight: 700;
            color: #040c13;
            margin-bottom: 15px;
        }

        /* Add to Rig Button */
        .add-cart-action-btn {
            background-color: #fff200; /* Best Buy Signature Yellow Accent */
            color: #040c13;
            border: 1px solid #d7c900;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.15s;
        }

        .add-cart-action-btn:hover {
            background-color: #e6d900;
        }
    </style>
</head>
<body>

    <!-- Mock Navigation Panel Wrapper -->
    <div class="browser-navbar">
        <!-- Displaying the request domain URL directly in the input bar structure -->
        <div class="address-input-bar">https://bestbuy.com</div>
    </div>

    <!-- The Clean White Main Display Screen Canvas Area -->
    <div class="main-window-viewport">
        <div class="store-brand-title">BEST BUY</div>
        <div class="store-brand-subtitle">Official Hardware Simulation Catalog Marketplace</div>

        <!-- Inventory Registry Display Frame Shelf Grid -->
        <div class="hardware-catalog-matrix" id="market-grid-container">
            <!-- Hardware cards are injected here dynamically by script loop logic -->
        </div>
    </div>

    <script>
        // System Data Registry array housing all target custom computer parts
        const computerHardwareInventory = [
            { title: "NVIDIA GeForce RTX 5090 Graphics Card", price: "$1,999", class: "GPU" },
            { title: "Intel Core i9-16900K 16-Core Processor", price: "$599", class: "CPU" },
            { title: "AMD Ryzen 9 9950X 16-Core Processor", price: "$649", class: "CPU" },
            { title: "Corsair Vengeance 64GB DDR5 Memory Kit", price: "$249", class: "RAM" },
            { title: "Samsung 990 PRO 2TB NVMe PCIe SSD", price: "$189", class: "Storage" }
        ];

        // Loop engine mechanics appending visual nodes onto DOM matrix display wrap
        const catalogTargetArea = document.getElementById('market-grid-container');
        
        computerHardwareInventory.forEach(component => {
            const displayCardNode = document.createElement('div');
            displayCardNode.className = 'hardware-item-card';
            displayCardNode.innerHTML = `
                <div>
                    <div class="hardware-tag">${component.class}</div>
                    <h3>${component.title}</h3>
                </div>
                <div>
                    <div class="hardware-price-tag">${component.price}</div>
                    <button class="add-cart-action-btn" onclick="dispatchOrderEvent('${component.title}')">Add to Build</button>
                </div>
            `;
            catalogTargetArea.appendChild(displayCardNode);
        });

        // Communication message handler executing background sync upwards into laptop.html
        function dispatchOrderEvent(partName) {
            alert(`🛒 Best Buy Order Placed: [ ${partName} ] processed for deployment.`);
            
            // Broadcasts notification block pack straight up across active frame session boundary layers
            window.parent.postMessage({
                type: 'ITEM_PURCHASED',
                itemName: partName
            }, '*');
        }
    </script>

</body>
</html>
