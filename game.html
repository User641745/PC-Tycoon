<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate PC Builder Simulator</title>
    <style>
        /* Main Game Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #12121c);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        #game-world {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        /* Top Right "Open Store" Button */
        #store-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #007bff, #00d2ff);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }

        #store-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        /* Fake Google Browser Overlay */
        #browser-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 20;
        }

        .browser-window {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Browser Header Bar */
        .browser-header {
            background-color: #f1f3f4;
            padding: 10px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .close-btn {
            background-color: #ff5f56;
            border: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 15px;
        }

        .address-bar {
            background-color: white;
            color: #333;
            padding: 6px 15px;
            border-radius: 20px;
            flex-grow: 1;
            font-size: 14px;
            border: 1px solid #chchch;
            user-select: none;
        }

        /* Fake Google Homepage */
        .google-page {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            color: #333;
            padding: 20px;
            overflow-y: auto;
        }

        .google-logo {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 25px;
            font-family: 'Product Sans', Arial, sans-serif;
        }

        .search-container {
            width: 100%;
            max-width: 580px;
            position: relative;
            display: flex;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }

        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-btn {
            position: absolute;
            right: 15px;
            top: 25%;
            background: none;
            border: none;
            color: #4285f4;
            font-weight: bold;
            cursor: pointer;
        }

        /* Dynamic Search Results & Store */
        .results-container {
            display: none;
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
            text-align: left;
        }

        .recommendation-box {
            background-color: #f8f9fa;
            border-left: 4px solid #34a853;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .component-card {
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 15px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .component-card h4 {
            margin: 0 0 10px 0;
            color: #1a0dab;
        }

        .component-price {
            font-size: 18px;
            font-weight: bold;
            color: #34a853;
            margin-bottom: 15px;
        }

        .buy-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Inventory Alert UI */
        #inventory-status {
            margin-top: 20px;
            font-size: 18px;
            color: #a8ffb2;
        }
    </style>
</head>
<body>

    <!-- Main Game Screen -->
    <div id="game-world">
        <h1>🖥️ Ultimate PC Simulator 🖥️</h1>
        <p>Build the ultimate custom rig. Click the button to search the globe for parts!</p>
        <div id="inventory-status">Your Rig: Stock Parts</div>
        <button id="store-btn" onclick="openStore()">🛒 Open Store</button>
    </div>

    <!-- The Fake Google Browser Window -->
    <div id="browser-overlay">
        <div class="browser-window">
            <div class="browser-header">
                <button class="close-btn" onclick="closeStore()"></button>
                <div class="address-bar" id="current-url">https://google.com</div>
            </div>
            
            <div class="google-page">
                <!-- Google Branding -->
                <div class="google-logo">
                    <span style="color: #4285F4">G</span><span style="color: #EA4335">o</span><span style="color: #FBBC05">o</span><span style="color: #4285F4">g</span><span style="color: #34A853">l</span><span style="color: #EA4335">e</span>
                </div>
                
                <!-- Search Box -->
                <div class="search-container">
                    <input type="text" id="search-query" class="search-input" placeholder="Search 'PC parts', 'Tokyo stores', 'Best GPUs'..." onkeypress="handleKeyPress(event)">
                    <button class="search-btn" onclick="executeSearch()">Search</button>
                </div>

                <!-- Results & Component Shop -->
                <div id="results" class="results-container">
                    <div class="recommendation-box">
                        <h3>🤖 AI Store Recommendation</h3>
                        <p id="recommendation-text">Type something like "PC parts" or a city name to see local shops!</p>
                    </div>

                    <h3>🛒 Available Global Components</h3>
                    <div class="shop-grid" id="market-shelf">
                        <!-- Components will get generated here dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Database of Global PC Places and recommendations
        const database = {
            components: [
                { name: "NVIDIA RTX 5090 GPU", price: "$1,999", type: "Graphics Card" },
                { name: "Intel Core i9-16900K", price: "$599", type: "Processor" },
                { name: "AMD Ryzen 9 9950X", price: "$649", type: "Processor" },
                { name: "Corsair Dominator 64GB DDR5", price: "$249", type: "RAM" },
                { name: "Samsung 990 PRO 4TB NVMe SSD", price: "$320", type: "Storage" },
                { name: "ASUS ROG Maximus Z890", price: "$499", type: "Motherboard" }
            ],
            places: [
                { keyword: "tokyo", name: "Akihabara Electric Town (Tokyo)", rec: "Highly recommended for rare components and custom Japanese case mods!" },
                { keyword: "america", name: "Micro Center (USA)", rec: "The absolute best physical store chain in America for bundle deals and raw inventory." },
                { keyword: "london", name: "Tottenham Court Road (London)", rec: "Great historic spot for picking up specialty custom water cooling gear in the UK." },
                { keyword: "online", name: "Newegg / Amazon Global", rec: "Best option if you want direct shipping of every single component ever made anywhere." }
            ]
        };

        function openStore() {
            document.getElementById('browser-overlay').style.display = 'block';
        }

        function closeStore() {
            document.getElementById('browser-overlay').style.display = 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        }

        function executeSearch() {
            const query = document.getElementById('search-query').value.toLowerCase();
            if (!query.trim()) return;
