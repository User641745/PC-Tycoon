<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate PC Builder Simulator</title>
    <style>
        /* Main Game Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #12121c);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        #game-world {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        /* Top Right "Open Store" Button */
        #store-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #007bff, #00d2ff);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 10;
        }

        #store-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        /* Browser Window Overlay */
        #browser-overlay {
            display: none; /* Controlled by JavaScript onClick */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 20;
        }

        .browser-window {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Browser Frame Header Bar */
        .browser-header {
            background-color: #f1f3f4;
            padding: 10px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .close-btn {
            background-color: #ff5f56;
            border: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 15px;
        }

        .address-bar {
            background-color: white;
            color: #333;
            padding: 6px 15px;
            border-radius: 20px;
            flex-grow: 1;
            font-size: 14px;
            border: 1px solid #ccc;
            user-select: none;
        }

        /* Fake Web Page Content Container */
        .web-page {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            color: #333;
            padding: 20px;
            overflow-y: auto;
        }

        .search-bar-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .search-input {
            flex-grow: 1;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccd0d5;
            border-radius: 6px;
            outline: none;
        }

        .search-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Shop Parts Matrix Layout */
        .parts-marketplace {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .part-item-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .part-item-card h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #1a0dab;
        }

        .part-spec {
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 10px;
        }

        .part-cost {
            font-size: 20px;
            font-weight: bold;
            color: #202124;
            margin-bottom: 15px;
        }

        .add-part-btn {
            background-color: #34a853;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .add-part-btn:hover {
            background-color: #2b8c44;
        }

        /* Game State Displays */
        #inventory-status {
            margin-top: 20px;
            font-size: 18px;
            color: #a8ffb2;
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 8px;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- Main Active Simulator World -->
    <div id="game-world">
        <h1>🖥️ Ultimate PC Simulator 🖥️</h1>
        <p>Build the ultimate custom rig.</p>
        
        <!-- The Main Button triggered via user click -->
        <button id="store-btn" onclick="toggleBrowser(true)">🛒 Open Store</button>
        
        <div id="inventory-status">
            <strong>Active Build Profile:</strong> <br>
            <span id="equipped-parts">Basic Stock Chassis Only</span>
        </div>
    </div>

    <!-- The Popup Web Browser Window Frame -->
    <div id="browser-overlay">
        <div class="browser-window">
            <div class="browser-header">
                <!-- Red dot close button element -->
                <button class="close-btn" onclick="toggleBrowser(false)"></button>
                <div class="address-bar" id="web-url-display">https://global-pc-marketplace.net</div>
            </div>
            
            <div class="web-page">
                <h2>🌐 Global PC Components Directory</h2>
                <p>Filter or search the network directory registry database for hardware components.</p>
                
                <!-- Filter search input system -->
                <div class="search-bar-container">
                    <input type="text" id="directory-search" class="search-input" placeholder="Type a brand or part (e.g., NVIDIA, RAM, SSD)..." onkeyup="filterComponents()">
                    <button class="search-btn" onclick="filterComponents()">Search</button>
                </div>

                <!-- Product Catalog Shelf Placement -->
                <div class="parts-marketplace" id="parts-shelf">
                    <!-- Dynamic hardware cards are automatically appended here by the engine -->
                </div>
            </div>
        </div>
    </div>

    <!-- Interface Logic Engine -->
    <script>
        // Data Registry Repository containing core target PC components
        const componentRegistry = [
            { name: "NVIDIA RTX 5090 Ti Founders Edition", price: "$2,499", category: "Graphics Card" },
            { name: "AMD Radeon RX 8900 XTX", price: "$1,199", category: "Graphics Card" },
            { name: "Intel Core Ultra 9 285K", price: "$589", category: "Processor" },
            { name: "AMD Ryzen 9 9950X3D", price: "$699", category: "Processor" },
            { name: "G.Skill Trident Z5 96GB DDR5 Dual Kit", price: "$389", category: "RAM" },
            { name: "Crucial T705 4TB Gen5 NVMe SSD", price: "$510", category: "Storage" },
            { name: "ASUS ROG Crosshair X870E HERO", price: "$680", category: "Motherboard" },
            { name: "Corsair AX1600i Digital Titanium PSU", price: "$450", category: "Power Supply" },
            { name: "Lian Li O11 Dynamic EVO XL Case", price: "$240", category: "PC Chassis" }
        ];

        // Track what hardware items the user has ordered
        let purchasedItems = [];

        // ON BUTTON CLICK SCRIPT: toggles visibility profile of browser window structure
        function toggleBrowser(shouldShow) {
            const overlay = document.getElementById('browser-overlay');
            if (shouldShow) {
                overlay.style.display = 'block';
                // Automatically generate catalog entries upon load window frame execution
                renderMarketplace(componentRegistry);
            } else {
                overlay.style.display = 'none';
            }
        }

        // Render hardware components database inside layout wrapper grid
        function renderMarketplace(itemsList) {
            const container = document.getElementById('parts-shelf');
            container.innerHTML = ""; // Clear existing grid canvas viewport layout

            if(itemsList.length === 0) {
                container.innerHTML = `<p style="color: #5f6368; grid-column: 1/-1;">No hardware inventory matches your query criteria.</p>`;
                return;
            }

            itemsList.forEach((item, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'part-item-card';
                cardElement.innerHTML = `
                    <div>
                        <h3>${item.name}</h3>
                        <div class="part-spec">${item.category}</div>
                    </div>
                    <div>
