<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewport Simulator</title>
    <style>
        /* Immersive full-screen environment layout setup */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient HUD overlay container framework indicators */
        .hud-overlay {
            position: absolute;
            top: 25px;
            pointer-events: none; /* Let control mouse coordinates pass safely straight into canvas */
            text-align: center;
            z-index: 10;
        }

        .hud-banner {
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            color: #00c6ff;
            border: 1px solid rgba(0, 198, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 3D Engine Frame Viewport Box Styling Profiles */
        #render-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #render-container:active {
            cursor: grabbing;
        }
    </style>
    <!-- Imports Three.js engine mechanics directly to configure 3D variables smoothly on his Chromebook -->
    <script src="https://cloudflare.com"></script>
    <!-- Imports OrbitControls configuration matrix to handle camera navigation look arounds -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Instructions banner HUD module display -->
    <div class="hud-overlay">
        <div class="hud-banner">🖱️ Click + Drag mouse cursor around screen to rotate and view block</div>
    </div>

    <!-- Active 3D Render Port container box structure -->
    <div id="render-container"></div>

    <script>
        // --- 1. SETUP 3D VIEWPORT CONTAINER ENGINE CONTEXT ---
        const container = document.getElementById('render-container');
        const scene = new THREE.Scene();
        
        // Setup depth matrix atmospheric field fog elements
        scene.background = new THREE.Color(0x0a0b10);
        scene.fog = new THREE.FogExp2(0x0a0b10, 0.04);

        // --- 2. CAMERA COORDINATES MATRIX PARAMETERS ---
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5); // Position camera offset array bounds looking downward at object angles

        // --- 3. RENDERER ENGINE MECHANICS PIPELINE ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Dynamic responsive Chromebook scaling profile logic
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- 4. NAVIGATION LOOK-AROUND ENGINE CONTROLS ---
        const navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
        navigationControls.enableDamping = true; // Adds smooth weight momentum to camera tracking pans
        navigationControls.dampingFactor = 0.05;
        navigationControls.minDistance = 2;   // Limit how close you can zoom inward
        navigationControls.maxDistance = 15;  // Limit how far back camera tracking bounds can pass out

        // --- 5. GRID MATRIX SPACE FLOOR STAGE MODULATION ---
        const gridFloorHelper = new THREE.GridHelper(20, 20, 0x00c6ff, 0x1f2330);
        gridFloorHelper.position.y = -1.5;
        scene.add(gridFloorHelper);

        // --- 6. ILLUMINATION LIGHT SOURCE LAYOUT COMPONENT RIGS ---
        const keyDirectionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyDirectionalLight.position.set(5, 8, 5);
        keyDirectionalLight.castShadow = true;
        scene.add(keyDirectionalLight);

        const neonFillBlueLight = new THREE.PointLight(0x0072ff, 1.5, 10);
        neonFillBlueLight.position.set(-3, 2, -3);
        scene.add(neonFillBlueLight);

        const ambientCoreBaseLight = new THREE.AmbientLight(0x1a1a2e, 0.6);
        scene.add(ambientCoreBaseLight);

        // --- 7. CREATE INTERACTIVE 3D OBJECT SYSTEM BLOCKS (The Custom Case Rigid Body Frame) ---
        const objectGroup = new THREE.Group();

        // Layer A: Main computer tower structural frame box object dimension geometry vectors
        const structuralBoxGeo = new THREE.BoxGeometry(1.8, 2.4, 1.8);
        const casingMaterialStyle = new THREE.MeshStandardMaterial({
            color: 0x1a1c23,
            roughness: 0.4,
            metalness: 0.8
        });
        const customCaseRigBodyMesh = new THREE.Mesh(structuralBoxGeo, casingMaterialStyle);
        customCaseRigBodyMesh.castShadow = true;
        customCaseRigBodyMesh.receiveShadow = true;
        objectGroup.add(customCaseRigBodyMesh);

        // Layer B: Visual Neon Accent Ribbon Strip Panels
        const stripGeometry = new THREE.BoxGeometry(0.1, 2.42, 0.1);
        const customNeonMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff88 }); // Bright neon green corner strips
        
        const frontLeftStrip = new THREE.Mesh(stripGeometry, customNeonMaterial);
        frontLeftStrip.position.set(0.91, 0, 0.91);
        objectGroup.add(frontLeftStrip);

        const frontRightStrip = new THREE.Mesh(stripGeometry, customNeonMaterial);
        frontRightStrip.position.set(-0.91, 0, 0.91);
        objectGroup.add(frontRightStrip);

        // Add final compiled components layout parameters directly into scene canvas space
        scene.add(objectGroup);

        // --- 8. DYNAMIC ANIMATION RENDER REFRESH ENGINE LOOP MECHANICS ---
        function frameUpdateEngine() {
            requestAnimationFrame(frameUpdateEngine);

            // Automatically updates navigation calculations to match cursor dragging movements parameters values
            navigationControls.update();

            // Run active frame buffer pass cleanly onto screen vector grid coordinates channels
            renderer.render(scene, camera);
        }

        // Trigger startup engine animation processes execution loop
        frameUpdateEngine();

        // --- 9. RESPONSIVE SCREEN RE-SIZING RESOLUTION UTILITIES HANDLING ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
