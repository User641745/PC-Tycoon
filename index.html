<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PC Builder & Market Tycoon</title>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-dark: #161920;
            --border-color: #242936;
            --accent-blue: #007acc;
            --accent-green: #4caf50;
            --accent-purple: #9c27b0;
            --text-main: #e3e6ed;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- MAIN MENU STYLING --- */
        #main-menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f1115 0%, #1a1d24 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .menu-layout {
            display: flex;
            align-items: center;
            gap: 60px;
            background: rgba(22, 25, 32, 0.6);
            padding: 50px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            max-width: 900px;
            width: 90%;
        }

        .menu-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #007acc, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .menu-btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 320px;
            transition: all 0.3s ease;
        }

        .menu-main-btn {
            background: #1c212c;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .menu-main-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            transform: translateX(5px);
        }

        /* Slot & Mode Panels Overlay */
        #slots-container, #gamemode-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 320px;
            margin-top: 10px;
            animation: fadeIn 0.4s ease forwards;
        }

        .slot-card, .mode-card {
            background: #12141a;
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .slot-card:hover {
            border-color: var(--accent-green);
            background: rgba(76, 175, 80, 0.05);
            transform: translateY(-2px);
        }

        .mode-card:hover.career-mode {
            border-color: var(--accent-green);
            background: rgba(76, 175, 80, 0.05);
            transform: translateY(-2px);
        }

        .mode-card:hover.sandbox-mode {
            border-color: var(--accent-purple);
            background: rgba(156, 39, 176, 0.05);
            transform: translateY(-2px);
        }

        .slot-name, .mode-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .slot-meta, .mode-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            text-align: left;
            margin-top: 5px;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            color: var(--text-main);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 3D CANVAS & HUD ARCHITECTURE --- */
        #center-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .hud-panel {
            width: 340px;
            height: 100vh;
            background-color: rgba(22, 25, 32, 0.95);
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }

        #left-hud-panel { border-right: 2px solid var(--border-color); }
        #right-hud-panel { border-left: 2px solid var(--border-color); }

        .panel-header {
            padding: 15px;
            background-color: #12141a;
            border-bottom: 2px solid var(--border-color);
        }

        .stats-bar {
            padding: 12px 15px;
            background: #1c212c;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--accent-green);
            display: flex;
            justify-content: space-between;
        }

        .tab-group {
            display: flex;
            background: #12141a;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            background: rgba(0, 122, 204, 0.05);
        }

        .tab-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .tab-content.active { display: block; }

        .part-card {
            background: #1c212c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Menu Overlay -->
    <div id="main-menu-overlay">
        <div class="menu-layout">
            <div class="menu-left">
                <h1 class="game-title">PC Tycoon</h1>
                
                <!-- Main Action Stack -->
                <div class="menu-btn-stack" id="main-nav-stack">
                    <button class="menu-main-btn" id="btn-new-game">New Game</button>
                    <button class="menu-main-btn" id="btn-load-trigger">Load Game</button>
                </div>

                <!-- Save Slots Layer Panel -->
                <div id="slots-container">
                    <div class="slot-card" onclick="selectSaveSlot(1)">
                        <div class="slot-name">Slot 1 (Empty)</div>
                        <div class="slot-meta"><div>--/--</div><div>New Profile</div></div>
                    </div>
                    <div class="slot-card" onclick="selectSaveSlot(2)">
                        <div class="slot-name">Slot 2 (Empty)</div>
                        <div class="slot-meta"><div>--/--</div><div>New Profile</div></div>
                    </div>
                    <div class="slot-card" onclick="selectSaveSlot(3)">
                        <div class="slot-name">Slot 3 (Empty)</div>
                        <div class="slot-meta"><div>--/--</div><div>New Profile</div></div>
                    </div>
                    <button class="back-btn" id="btn-slots-back">← Back to Menu</button>
                </div>

                <!-- New Gamemode Prompt Selection Stack -->
                <div id="gamemode-container">
                    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;">Select System Logic Environment:</div>
                    <div class="mode-card career-mode" onclick="setGamemode('career')">
                        <div class="mode-name" style="color: var(--accent-green);">💼 Career Mode</div>
