<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewport with Assembly Drop</title>
    <style>
        body { margin: 0; background: #050508; overflow: hidden; height: 100vh; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* Blue Menu Toggle button locked to the absolute top layer */
        .menu-toggle-btn {
            position: absolute; top: 20px; left: 20px; 
            z-index: 999;
            background: #0072ff; color: white; border: none; padding: 12px 24px;
            font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 114, 255, 0.4);
        }
        .menu-toggle-btn:hover { background: #0052d4; }

        /* The Main Solid Black Side Menu Panel Drawer */
        .side-menu-drawer {
            position: absolute; top: 0; left: -260px; width: 260px; height: 100vh;
            background: #000000; border-right: 2px solid #222222; 
            z-index: 50; transition: left 0.3s ease-in-out; 
            padding: 90px 20px 20px 20px; box-sizing: border-box;
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 15px;
        }
        .side-menu-drawer.open { left: 0; }

        .drawer-btn {
            background: #ffffff; color: #000000; border: none; width: 100%; padding: 12px;
            font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer;
            text-align: center; text-decoration: none; display: block; box-sizing: border-box;
        }
        .drawer-btn:hover { background: #e0e0e0; }

        /* The Parts List box display area container */
        .parts-display-box {
            display: none; background: #111116; border: 1px solid #222233;
            border-radius: 6px; padding: 10px; margin-top: 5px;
            max-height: 250px; overflow-y: auto; flex-direction: column; gap: 10px;
        }
        .parts-display-box.show { display: flex; }

        /* Draggable visual part tiles inside the menu drawer */
        .part-draggable-card {
            background: #0072ff; color: #ffffff; padding: 10px;
            font-size: 12px; font-weight: bold; border-radius: 6px;
            cursor: move; text-align: center; user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border: 1px solid #00c6ff;
        }
        .part-draggable-card:active { opacity: 0.6; }

        /* Glowing HUD overlay feedback notifications block */
        .hud-status-banner {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); border: 1px solid #00ff88; color: #00ff88;
            padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: bold;
            display: none; z-index: 10; pointer-events: none;
            box-shadow: 0 0 15px rgba(0,255,136,0.3);
        }
    </style>
</head>
<body>

    <button class="menu-toggle-btn" onclick="toggleSideMenu()">☰ Menu</button>
    
    <div class="side-menu-drawer" id="sideMenu">
        <a href="store.html" class="drawer-btn">🌐 Browser</a>
        <button class="drawer-btn" onclick="togglePartsList()">📦 Parts</button>
        
        <div class="parts-display-box" id="partsDisplay">
            <!-- This starts completely empty as requested if nothing has been bought! -->
            <p id="empty-hint" style="color: #555; font-size: 12px; text-align: center; margin: 5px 0;">Your inventory is empty. Go to the store browser to buy parts!</p>
        </div>
    </div>

    <!-- Live notifications status feed -->
    <div class="hud-status-banner" id="hudBanner"></div>

    <canvas id="c"></canvas>
    
    <script>
        // Track whether any hardware item has been successfully snapped inside the cube core
        let installedComponentsList = [];

        function toggleSideMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
        }

        function togglePartsList() {
            const displayBox = document.getElementById('partsDisplay');
            displayBox.classList.toggle('show');
            if(displayBox.classList.contains('show')) {
                renderInventoryList();
            }
        }

        // 1. DYNAMICALLY READ AND RENDER PURCHASED PARTS
        function renderInventoryList() {
            const containerBox = document.getElementById('partsDisplay');
            // Pulls live data cache arrays from store page purchases
            const inventoryData = JSON.parse(localStorage.getItem('pc_simulator_inventory')) || [];
            
            // Filter out items that have already been installed inside the cube geometry
            const spendableItems = inventoryData.filter(part => !installedComponentsList.includes(part));

            if(spendableItems.length === 0) {
                containerBox.innerHTML = `<p style="color: #555; font-size: 12px; text-align: center; margin: 5px 0;">Your inventory is empty. Go to the store browser to buy parts!</p>`;
                return;
            }
            
            containerBox.innerHTML = ""; // Wipe default tracking placeholders
            
            spendableItems.forEach(item => {
                const partCard = document.createElement('div');
                partCard.className = 'part-draggable-card';
                partCard.innerText = item;
                
                // Attach Native Drag HTML5 properties to the part tile element box mesh
                partCard.draggable = true;
                partCard.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', item);
                });

                containerBox.appendChild(partCard);
            });
        }

        // --- CONFIGURE 3D CANVAS TARGET DROP LISTENERS BOUNDS ---
        const canvasElement = document.getElementById('c');

        canvasElement.addEventListener('dragover', (e) => {
            e.preventDefault(); // Required line to allow dropping items onto a canvas matrix
        });

        canvasElement.addEventListener('drop', (e) => {
            e.preventDefault();
            const droppedPartName = e.dataTransfer.getData('text/plain');
            
            if (!droppedPartName) return;

            // Trigger the installation and snap routine logic handler
            executeInstallation(droppedPartName, e.clientX, e.clientY);
        });

        function executeInstallation(partName, mouseX, mouseY) {
            // Check if the coordinates drop zone falls close to the center screen 3D block
            const centerX = w / 2;
            const centerY = h / 2;
            const dragDistanceToCube = Math.hypot(mouseX - centerX, mouseY - centerY);

            if (dragDistanceToCube < 130) { // Snaps if item is dropped near the cube perimeter radius bounds
                installedComponentsList.push(partName);
                
                // Show a successful installation hud banner notification
                const banner = document.getElementById('hudBanner');
                banner.innerText = `⚙️ Component Installed: [ ${partName} ] locked inside the Core Rig Block!`;
                banner.style.display = 'block';
                
                // Auto-refresh the drawer array list elements to remove the spent item instantly
                renderInventoryList();
                
                // Close the menu bar cleanly to show the upgraded block
                document.getElementById('sideMenu').classList.remove('open');

                setTimeout(() => { banner.style.display = 'none'; }, 4000);
            } else {
                alert("⚠️ Drop Missed! Drag the component tile and drop it directly onto the center 3D block structure!");
            }
        }

        // --- 2. THE 3D ENGINE GRAPHICS MECHANICS PANEL ---
        const ctx = c.getContext('2d');
        let w = c.width = window.innerWidth, h = c.height = window.innerHeight;
        window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };

        // 3D Cube Structural Corner Vector Mapping Profile
        const pts = [
            {x:-80, y:-80, z:-80}, {x:80, y:-80, z:-80}, {x:80, y:80, z:-80}, {x:-80, y:80, z:-80},
            {x:-80, y:-80, z:80},  {x:80, y:-80, z:80},  {x:80, y:80, z:80},  {x:-80, y:80, z:80}
        ];
        const faces = [,,,,,
        ];

        // Camera Looking Orbit Rotational variables
        let rx = 0.5, ry = 0.6, drag = false, px = 0, py = 0;
        const start = e => { 
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A' || e.target.classList.contains('part-draggable-card')) return; 
            drag = true; px = e.clientX || e.touches.clientX; py = e.clientY || e.touches.clientY; 
        };
        const move = e => {
            if (!drag) return;
            let cx = e.clientX || e.touches.clientX, cy = e.clientY || e.touches.clientY;
            ry += (cx - px) * 0.01; rx += (cy - py) * 0.01; px = cx; py = cy;
        };
        window.onmousedown = window.ontouchstart = start;
        window.onmouseup = window.onmouseleave = window.ontouchend = () => drag = false;
        window.onmousemove = window.ontouchmove = move;

        // Vector Render Refresh Engine Loop
        function draw() {
            ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, w, h);
            let cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry);
            
            let screen = pts.map(p => {
                let x1 = p.x * cy - p.z * sy, z1 = p.x * sy + p.z * cy;
                let y2 = p.y * cx - z1 * sx,  z2 = p.y * sx + z1 * cx;
                let ratio = 400 / (400 + z2);
