<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk Workspace</title>
    <style>
        /* Main page setup */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #2c3e50, #0f171e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* The Custom Solid Black Background Panel Container */
        .workspace-panel {
            background-color: #000000;
            border: 2px solid #333333;
            padding: 40px 60px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* The Custom Blue Button Configuration */
        #open-browser-btn {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
            transition: all 0.2s ease-in-out;
        }

        #open-browser-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(111, 177, 252, 0.6);
        }

        #open-browser-btn:active {
            transform: translateY(1px);
        }

        /* Overlay frame to inject website.html securely into GitHub */
        #laptop-screen-modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .modal-content-wrapper {
            width: 90%;
            height: 85%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #laptop-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-laptop-btn {
            position: absolute;
            top: 12px;
            left: 15px;
            background-color: #ff5f56;
            border: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
        }
        
        .close-laptop-btn:hover {
            background-color: #e04a41;
        }

        #inventory-cart {
            margin-top: 20px;
            font-size: 14px;
            color: #6fb1fc;
        }
    </style>
</head>
<body>

    <!-- Black Background Workspace Box -->
    <div class="workspace-panel">
        <h1>🖥️ SYSTEM COMMAND CENTER</h1>
        
        <!-- On-Button Script Trigger updated to "Open Browser" -->
        <button id="open-browser-btn" onclick="openLaptopView()">Open Browser</button>
        
        <div id="inventory-cart">Parts Collected: None</div>
    </div>

    <!-- The Popup Browser Modal Interface -->
    <div id="laptop-screen-modal">
        <div class="modal-content-wrapper">
            <button class="close-laptop-btn" onclick="closeLaptopView()"></button>
            <iframe id="laptop-iframe" src=""></iframe>
        </div>
    </div>

    <script>
        function openLaptopView() {
            document.getElementById('laptop-iframe').src = 'website.html';
            document.getElementById('laptop-screen-modal').style.display = 'flex';
        }

        function closeLaptopView() {
            document.getElementById('laptop-screen-modal').style.display = 'none';
            document.getElementById('laptop-iframe').src = '';
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'ITEM_PURCHASED') {
                document.getElementById('inventory-cart').innerHTML = `📦 Latest Part Obtained: <strong>${event.data.itemName}</strong>`;
            }
        });
    </script>

</body>
</html>
