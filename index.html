<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PC Builder & Market Tycoon</title>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-dark: #161920;
            --border-color: #242936;
            --accent-blue: #007acc;
            --accent-green: #4caf50;
            --text-main: #e3e6ed;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- 3D RENDER CANVAS BACKGROUND --- */
        #center-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #202530 0%, #0a0c10 100%);
            z-index: 1; /* Pushed to the bottom layer */
        }

        /* --- UI OVERLAY LAYER PLATFORM (Sits completely on top of 3D window) --- */
        #ui-layer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows mouse clicks to pass through empty spaces to spin the 3D case */
            display: flex;
            justify-content: space-between;
            z-index: 100; /* High index to force visibility above everything */
        }

        .hud-panel {
            width: 340px;
            height: 100vh;
            background-color: rgba(22, 25, 32, 0.95); /* Semi-transparent sleek slate dark glass overlay */
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            pointer-events: auto; /* Re-enables clicking inside the panels */
            display: flex;
            flex-direction: column;
        }

        #left-hud-panel {
            border-right: 2px solid var(--border-color);
        }

        #right-hud-panel {
            border-left: 2px solid var(--border-color);
        }

        /* --- UI Elements & Headers --- */
        .panel-header {
            padding: 15px;
            background-color: #12141a;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .stats-bar {
            padding: 12px 15px;
            background: #1c212c;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--accent-green);
            display: flex;
            justify-content: space-between;
        }

        /* --- Tabs --- */
        .tab-group {
            display: flex;
            background: #12141a;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            background: rgba(0, 122, 204, 0.05);
        }

        .tab-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* --- Item Cards & Lists --- */
        .part-card {
            background: #1c212c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .part-card-title {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .part-card-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .part-card-price {
            color: var(--accent-green);
            font-weight: bold;
        }

        .input-bar {
            width: 100%;
            background: #12141a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: white;
            font-size: 1rem;
            margin-top: 5px;
            outline: none;
        }

        .input-bar:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled {
            background-color: #3a3f4d;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-success { background-color: var(--accent-green); }

        /* --- Floating Center Info Overlays --- */
        #view-controls-tip {
            position: absolute;
            top: 15px;
            left: 360px; /* Offset to clear the left panel */
            background: rgba(22, 25, 32, 0.85);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            pointer-events: none;
            z-index: 101;
        }

        #assembly-status-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 25, 32, 0.95);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            width: 450px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: auto; /* Active clicking */
            z-index: 101;
        }

        .paste-active {
            cursor: crosshair !important;
        }

        #paste-progress-bar {
            width: 100%;
            background: #242936;
            height: 10px;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        #paste-progress-fill {
            height: 100%;
            background: #d1d5db;
            width: 0%;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- BACKGROUND LAYER: 3D Render Viewport Window -->
        <div id="center-canvas-container"></div>

        <!-- FLOATING OVERLAYS: Guidelines & Assembly Console Status Boxes -->
        <div id="view-controls-tip">🖱️ Left Click + Drag anywhere on the center background to rotate 3D Case</div>
        
        <div id="assembly-status-box">
            <h4 id="status-title" style="margin-bottom: 5px;">Empty Rig Chassis</h4>
            <p id="status-desc" style="font-size: 0.85rem; color: var(--text-muted);">Open your tablet on the left panel, buy parts, and select them from your inventory to begin assembly.</p>
            <div id="paste-progress-bar"><div id="paste-progress-fill"></div></div>
            <button id="action-tool-btn" class="btn" style="margin-top: 10px; display: none;"></button>
        </div>

        <!-- TOP FOREGROUND LAYER: Full Interactive UI Overlay Shell -->
        <div id="ui-layer-overlay">
            
            <!-- LEFT SCREEN CONTROL HUD: Shop & Inventory Management -->
            <div id="left-hud-panel" class="hud-panel">
                <div class="panel-header">
                    <h2>Tech Tablet v4.0</h2>
                </div>
                <div class="stats-bar">
                    <span>Wallet Balance:</span>
                    <span id="wallet-display">$2,500</span>
                </div>
                
                <div class="tab-group">
                    <button id="store-tab-btn" class="tab-btn active" onclick="switchTab('left', 'store', this)">Shop Parts</button>
                    <button id="inv-tab-btn" class="tab-btn" onclick="switchTab('left', 'inventory', this)">Inventory</button>
                </div>

                <div id="tab-store" class="tab-content active">
                    <div id="store-list"></div>
                </div>

                <div id="tab-inventory" class="tab-content">
                    <div id="inventory-list"></div>
                </div>
            </div>

            <!-- RIGHT SCREEN CONTROL HUD: Specifications Checklist & E-Commerce Auction Network -->
            <div id="right-hud-panel" class="hud-panel">
                <div class="panel-header">
                    <h2>BayBuy Market Network</h2>
                </div>
                
                <div class="tab-group">
                    <button id="spec-tab-btn" class="tab-btn active" onclick="switchTab('right', 'rig-status', this)">Current PC Spec</button>
