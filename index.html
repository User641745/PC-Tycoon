<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewport Simulator</title>
    <style>
        /* Immersive full-screen background with no extra text variables */
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #render-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #render-container:active {
            cursor: grabbing;
        }
    </style>
    <!-- We only pull the core Three.js framework; no extra control files needed -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="render-container"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof THREE !== 'undefined') {
                initCustom3DEngine();
            }
        });

        function initCustom3DEngine() {
            const container = document.getElementById('render-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);

            // 1. DYNAMIC PERSPECTIVE CAMERA MATRIX Setup
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 4);

            // 2. WebGL RENDERING ENGINE Setup
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 3. STAGE GRID FLOOR HELPER MESH
            const gridFloorHelper = new THREE.GridHelper(20, 20, 0x444444, 0x1f2330);
            gridFloorHelper.position.y = -1.0;
            scene.add(gridFloorHelper);

            // 4. CRISP STUDIO ILLUMINATION LIGHTS
            const lightTop = new THREE.DirectionalLight(0xffffff, 1.5);
            lightTop.position.set(5, 10, 5);
            scene.add(lightTop);

            const lightBack = new THREE.DirectionalLight(0xffffff, 0.8);
            lightBack.position.set(-5, 5, -5);
            scene.add(lightBack);

            const ambientCoreBaseLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientCoreBaseLight);

            // 5. SPAWN THE PURE WHITE 3D TARGET CUBE BLOCK
            const structuralBoxGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
            const blockMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.2,
                metalness: 0.1
            });
            const mainBlockMesh = new THREE.Mesh(structuralBoxGeo, blockMaterial);
            scene.add(mainBlockMesh);

            // 6. CUSTOM NATIVE CLICK-AND-DRAG CALCULATION SYSTEM
            let isDraggingMouse = false;
            let previousMousePosition = { x: 0, y: 0 };

            // Triggers rotation values the moment mouse clicks down over viewport
            window.addEventListener('mousedown', (e) => {
                isDraggingMouse = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => {
                isDraggingMouse = false;
            });

            // Calculates changes in coordinates to turn the block up, down, left, and right
            window.addEventListener('mousemove', (e) => {
                if (!isDraggingMouse) return;

                const deltaMove = {
                    x: e.clientX - previousMousePosition.x,
                    y: e.clientY - previousMousePosition.y
                };

                // Apply rotation tracking updates to the cube geometry group directly
                mainBlockMesh.rotation.y += deltaMove.x * 0.007; // Sweeps Left and Right
                mainBlockMesh.rotation.x += deltaMove.y * 0.007; // Tilts Up and Down

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            // Touch Screen Support for Chromebook trackpads
            window.addEventListener('touchstart', (e) => {
                isDraggingMouse = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            window.addEventListener('touchend', () => {
                isDraggingMouse = false;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDraggingMouse) return;
                const deltaMove = {
                    x: e.touches[0].clientX - previousMousePosition.x,
                    y: e.touches[0].clientY - previousMousePosition.y
                };
                mainBlockMesh.rotation.y += deltaMove.x * 0.01;
                mainBlockMesh.rotation.x += deltaMove.y * 0.01;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            // 7. RENDER ANIMATION TICK REFRESH ENGINE LOOP
            function frameUpdateEngine() {
                requestAnimationFrame(frameUpdateEngine);
                
                // Keep target camera locked directly looking onto origin point coordinates
                camera.lookAt(0, 0, 0);
                
                renderer.render(scene, camera);
            }
            frameUpdateEngine();

            // 8. DYNAMIC RESOLUTION SCALING
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
