<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PC Builder & Market Tycoon</title>
    <!-- Three.js for 3D Graphics -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-dark: #161920;
            --border-color: #242936;
            --accent-blue: #007acc;
            --accent-green: #4caf50;
            --text-main: #e3e6ed;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- MAIN MENU STYLING --- */
        #main-menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f1115 0%, #1a1d24 100%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .menu-layout {
            display: flex;
            align-items: center;
            gap: 60px;
            background: rgba(22, 25, 32, 0.6);
            padding: 50px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            max-width: 900px;
            width: 90%;
        }

        .menu-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #007acc, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .menu-btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 250px;
        }

        .menu-main-btn {
            background: #1c212c;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .menu-main-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            transform: translateX(5px);
        }

        /* Graphic PC Illustration */
        .pc-svg-art {
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 0 15px rgba(0, 122, 204, 0.4));
        }

        /* Slot Selection Panel Overlay */
        #slots-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        .slot-card {
            background: #12141a;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .slot-card:hover {
            border-color: var(--accent-green);
            background: rgba(76, 175, 80, 0.05);
        }

        .slot-name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .slot-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* --- 3D CANVAS & HUD ARCHITECTURE --- */
        #center-canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #202530 0%, #0a0c10 100%);
            z-index: 1;
        }

        #ui-layer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .hud-panel {
            width: 340px;
            height: 100vh;
            background-color: rgba(22, 25, 32, 0.95);
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
        }

        #left-hud-panel { border-right: 2px solid var(--border-color); }
        #right-hud-panel { border-left: 2px solid var(--border-color); }

        .panel-header {
            padding: 15px;
            background-color: #12141a;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-bar {
            padding: 12px 15px;
            background: #1c212c;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--accent-green);
            display: flex;
            justify-content: space-between;
        }

        .tab-group {
            display: flex;
            background: #12141a;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            background: rgba(0, 122, 204, 0.05);
        }

        .tab-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .tab-content.active { display: block; }

        .part-card {
            background: #1c212c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .part-card-title { font-weight: bold; font-size: 0.95rem; }
        .part-card-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .part-card-price { color: var(--accent-green); font-weight: bold; }

        .input-bar {
            width: 100%;
            background: #12141a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            color: white;
            font-size: 1rem;
            margin-top: 5px;
            outline: none;
        }

        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }

        .btn:disabled {
            background-color: #3a3f4d;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-success { background-color: var(--accent-green); }

        #view-controls-tip {
            position: absolute;
            top: 15px;
            left: 360px;
            background: rgba(22, 25, 32, 0.85);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            pointer-events: none;
            z-index: 101;
        }

        #assembly-status-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 25, 32, 0.95);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            width: 450px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: auto;
            z-index: 101;
        }

        .paste-active { cursor: crosshair !important; }
        #paste-progress-bar { width: 100%; background: #242936; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; display: none; }
        #paste-progress-fill { height: 100%; background: #d1d5db; width: 0%; }
    </style>
</head>
<body>

    <!-- --- MAIN MENU ENGINE OVERLAY PANEL --- -->
    <div id="main-menu-overlay">
        <div class="menu-layout">
            <div class="menu-left">
                <h1 class="game-title">PC Tycoon</h1>
                
                <div class="menu-btn-stack" id="main-nav-buttons">
                    <button> class="menu-main-btn" onclick="showSaveSlots()">New Game</button>
