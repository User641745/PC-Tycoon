<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewport Simulator</title>
    <style>
        /* Immersive full-screen environment layout setup with no text */
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D Engine Frame Viewport Box */
        #render-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #render-container:active {
            cursor: grabbing;
        }
    </style>
    <!-- Imports Three.js engine mechanics -->
    <script src="https://cloudflare.com"></script>
    <!-- Imports OrbitControls configuration matrix to handle camera navigation look arounds -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Render Port container box structure -->
    <div id="render-container"></div>

    <script>
        // Start engine once elements are loaded safely
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined') {
                init3DEngine();
            }
        });

        function init3DEngine() {
            const container = document.getElementById('render-container');
            const scene = new THREE.Scene();
            
            scene.background = new THREE.Color(0x050508);

            // Camera Setup
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 3, 4);

            // Renderer Setup
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Navigation Mouse Look-Around Controls
            const navigationControls = new THREE.OrbitControls(camera, renderer.domElement);
            navigationControls.enableDamping = true;
            navigationControls.dampingFactor = 0.05;
            navigationControls.minDistance = 1.5;   
            navigationControls.maxDistance = 12;  

            // Subtle Floor Grid Pattern
            const gridFloorHelper = new THREE.GridHelper(20, 20, 0x444444, 0x1f2330);
            gridFloorHelper.position.y = -1.2;
            scene.add(gridFloorHelper);

            // Lighting to make the white block crisp and visible from all angles
            const keyDirectionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyDirectionalLight.position.set(5, 8, 5);
            scene.add(keyDirectionalLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
            fillLight.position.set(-5, 4, -5);
            scene.add(fillLight);

            const ambientCoreBaseLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientCoreBaseLight);

            // --- CREATE THE WHITE 3D BLOCK ---
            const structuralBoxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const blockMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff, // Pure solid white color
                roughness: 0.2,  // Slightly smooth finish
                metalness: 0.1
            });
            const whiteBlockMesh = new THREE.Mesh(structuralBoxGeo, blockMaterial);
            scene.add(whiteBlockMesh);

            // Dynamic Animation Frame Render Loop
            function frameUpdateEngine() {
                requestAnimationFrame(frameUpdateEngine);
                navigationControls.update();
                renderer.render(scene, camera);
            }

            frameUpdateEngine();

            // Handle Screen Resizing on the Chromebook
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
