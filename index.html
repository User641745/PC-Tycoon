<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Assembly Workbench Simulator</title>
    <style>
        /* Immersive Gaming Background Workspace */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #12131a, #09090d);
            color: white;
            height: 100vh;
            display: flex;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Center Assembly Workbench Window Workspace */
        .bench-view {
            flex-grow: 2;
            background: radial-gradient(circle, #1e2030 0%, #0d0e15 100%);
            border-right: 2px solid #252736;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
        }

        .bench-instruction-banner {
            position: absolute;
            top: 25px;
            background: rgba(0,0,0,0.75);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            border: 1px solid #00c6ff;
            color: #00c6ff;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.2);
            z-index: 10;
        }

        /* Interactive Moveable 2.5D Case Frame */
        .pc-case-chassis {
            width: 340px;
            height: 420px;
            background-color: #050508;
            border: 4px solid #3a3d52;
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); /* Panning animation engine */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        /* Internal Hardware Installation Plate Panel */
        .motherboard-plate {
            width: 260px;
            height: 320px;
            background-color: #143525; /* Classic printed circuit board layout green */
            border-radius: 8px;
            position: relative;
            opacity: 0.3; /* Lock state shading profile */
            transition: opacity 0.4s;
            border: 1px solid #1f5239;
        }

        /* Component Case Metal Thumbscrews */
        .case-screw {
            width: 18px;
            height: 18px;
            background: radial-gradient(circle, #ffffff, #888888, #444444);
            border: 1px solid #222;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }
        .case-screw::after {
            content: '';
            position: absolute;
            top: 8px; left: 3px; width: 12px; height: 2px;
            background-color: #222;
        }

        .screw-tl { top: 15px; left: 15px; }
        .screw-tr { top: 15px; right: 15px; }
        .screw-bl { bottom: 15px; left: 15px; }
        .screw-br { bottom: 15px; right: 15px; }

        /* The Tinted Removable Exterior Window Overlay Glass */
        .case-side-panel {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 198, 255, 0.12); /* Ambient LED glow refraction styling profile */
            border-radius: 8px;
            z-index: 4;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.5);
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        /* Motherboard Modular Hardware Target Slots */
        .hardware-socket {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255,255,255,0.25);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            padding: 4px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .hardware-socket:hover {
            background: rgba(0, 198, 255, 0.15);
            border-color: #00c6ff;
            color: #00c6ff;
        }

        .socket-cpu { top: 45px; left: 90px; width: 80px; height: 80px; }
        .socket-ram { top: 45px; right: 25px; width: 25px; height: 110px; font-size: 9px; }
        .socket-gpu { top: 165px; left: 25px; width: 210px; height: 65px; }

        /* Installation state styles */
        .component-installed {
            background-color: #0a1c3a !important;
            border: 2px solid #00ff88 !important;
            color: #00ff88 !important;
            box-shadow: 0 0 15px rgba(0,255,136,0.3);
        }

        /* Navigation Pan View Adjuster Mechanics Panel */
        .view-angle-controls {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 12px;
            z-index: 6;
        }
        .angle-btn {
            background: #1b1c26;
            color: white;
            border: 1px solid #33354a;
            padding: 10px 20px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.15s, border-color 0.15s;
        }
        .angle-btn:hover { 
            background: #0072ff; 
            border-color: #00c6ff;
        }

        /* Right Hand Inventory Utility Sidebar Deck Drawer */
        .parts-sidebar-drawer {
            width: 340px;
            background-color: #08090d;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            user-select: none;
            border-left: 1px solid #1a1b26;
        }

        .parts-sidebar-drawer h3 {
            margin: 0 0 20px 0;
            border-bottom: 2px solid #1e1e2f;
            padding-bottom: 10px;
            color: #00c6ff;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .inventory-list-shelf {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .inventory-item-card {
            background: #13141f;
            border: 1px solid #27283b;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .inventory-item-card:hover {
            background: #191a29;
            border-color: #00c6ff;
            transform: scale(1.02);
        }
        .inventory-item-card.selected {
            border: 2px solid #00c6ff;
            background: rgba(0, 198, 255, 0.08);
        }
    </style>
</head>
<body>

    <!-- Main Game Workspace Field Screen Viewport -->
    <div class="bench-view">
        <div class="bench-instruction-banner" id="banner-hint">🔧 WORKBENCH STARTED: Click all 4 metal screws to unlock the side casing panel layer!</div>
        
        <!-- Interactive Chassis Object -->
        <div class="pc-case-chassis" id="chassis-box" style="transform: rotate(0deg);">
            
            <!-- Protective glass sheet screen graphic layer node -->
            <div class="case-side-panel" id="glass-wall">TEMPERED GLASS PANEL</div>
            
            <!-- Screws structural targets execution buttons -->
            <div class="case-screw screw-tl" onclick="unscrew(this)"></div>
            <div class="case-screw screw-tr" onclick="unscrew(this)"></div>
            <div class="case-screw screw-bl" onclick="unscrew(this)"></div>
            <div class="case-screw screw-br" onclick="unscrew(this)"></div>
            
            <!-- Circuit board slots base core layout tray area -->
            <div class="motherboard-plate" id="mobo-tray">
                <div class="hardware-socket socket-cpu" onclick="installComponent('CPU', this)">CPU SOCKET</div>
                <div class="hardware-socket socket-ram" onclick="installComponent('RAM', this)">RAM SLOT 1</div>
                <div class="hardware-socket socket-gpu" onclick="installComponent('GPU', this)">PCIe GPU MOUNT</div>
            </div>

        </div>

        <!-- 3D Panning Looking Controls Matrix Interface -->
        <div class="view-angle-controls">
            <button class="angle-btn" onclick="rotateCase(-35)">🔄 Pan Left</button>
            <button class="angle-btn" onclick="rotateCase(0)">Frontal View</button>
            <button class="angle-btn" onclick="rotateCase(35)">Pan Right 🔄</button>
        </div>
    </div>

    <!-- Active Parts Shelf Grid Panel Container System -->
    <div class="parts-sidebar-drawer">
        <h3>📦 Inventory Warehouse</h3>
        <div class="inventory-list-shelf" id="inv-shelf-display">
            <!-- Simulated starting factory parts if memory store register is clear -->
            <p style="color: #4a4c5a; font-size: 13px;">No store components detected. Loading default test parts bundle...</p>
        </div>
    </div>

    <script>
        let brokenScrewsCount = 0;
        let isPanelRemoved = false;
        let selectedHardwareType = null;

        // Auto initialization load checks pulling from storage systems or default profiles
        window.onload = function() {
            let currentPartsList = JSON.parse(localStorage.getItem('pc_simulator_inventory')) || [];
